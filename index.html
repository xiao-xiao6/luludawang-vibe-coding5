<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffcc4d' stroke='%238a6410' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff6d0' stroke-width='2'/%3E%3C/svg%3E">
<title>推币机 · Coin Pusher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="cab">
    <header class="hud">
      <div class="brand">
        <span class="logo">PUSH</span>
        <span class="sub">推币机</span>
      </div>
      <div class="purse">
        <div class="cur" title="金币"><span class="ic coin">◎</span><b id="vCoin">0</b></div>
        <div class="cur" title="钻石"><span class="ic gem">◆</span><b id="vGem">0</b></div>
        <div class="cur" title="抽奖券"><span class="ic tix">✚</span><b id="vTix">0</b></div>
      </div>
      <div class="hud-actions">
        <div class="hud-left">
          <div class="cap ok" id="cap" title="台面容量：超过 80% 开始拥堵，满台硬塞会爆仓">
            <span class="cap-label">台面</span>
            <span class="cap-bar"><i id="capFill"></i></span>
            <span class="cap-text" id="capText">0/260</span>
          </div>
          <span class="chip warn" id="congestChip" hidden>拥堵</span>
          <span class="chip bad" id="streakChip" hidden>漏币中</span>
          <span class="chip bad" id="overheatChip" hidden>过热</span>
          <button type="button" id="btnPause" class="ico" aria-pressed="false" title="暂停/继续推板（快捷键 P）">⏸ 暂停</button>
        </div>
        <div class="hud-right">
          <button type="button" id="btnBailout" class="ico bail" hidden>🪙 领救济金 +30</button>
          <button type="button" id="btnShop" class="ico">商店</button>
          <button type="button" id="btnAch" class="ico">成就</button>
          <button type="button" id="btnStat" class="ico">统计</button>
          <button type="button" id="btnMute" class="ico" aria-pressed="true" title="音效已开启，点击静音">🔊 音效</button>
        </div>
      </div>
    </header>

    <div class="stage">
      <canvas id="cv" width="480" height="580" aria-label="推币机台面，点击或按空格投币"></canvas>
      <div class="fx-layer" aria-hidden="true">
        <div class="combo" id="comboBadge"></div>
        <div class="jackpot" id="jackpotFx"></div>
        <div class="hero" id="heroFx"></div>
      </div>
      <div class="stage-note" id="stageNote">点击台面投币 · 空格也行</div>
    </div>

    <div class="quest" id="questRow" hidden>
      <div class="quest-main">
        <span class="quest-tag" id="questTag">订单</span>
        <span class="quest-name" id="questName">—</span>
        <span class="quest-prog" id="questProg"></span>
      </div>
      <div class="quest-bar"><i id="questFill"></i></div>
      <div class="quest-acts">
        <span class="quest-time" id="questTime">0.0s</span>
        <button type="button" class="ico ok" id="btnOrderYes" hidden>接下订单</button>
        <button type="button" class="ico" id="btnOrderNo" hidden>算了</button>
      </div>
    </div>

    <footer class="pad">
      <button type="button" id="btnDrop" class="big">
        <span>投币</span><kbd>空格</kbd>
      </button>
      <button type="button" id="btnAuto" class="wide" aria-pressed="false" title="需先在商店购买「自动投币机」">
        自动投币 <span id="autoLv" class="tag">关</span>
      </button>
      <button type="button" id="btnHot" class="wide hot" title="超频：花金币换 8 秒双倍产出（快捷键 H）">
        超频 <span id="hotLv" class="tag">就绪</span>
      </button>
      <button type="button" id="btnLottery" class="wide">
        抽奖 <span id="tixLeft" class="tag">0/5</span>
      </button>
    </footer>

    <div class="ticker" id="ticker" role="status" aria-live="polite"></div>
  </div>

  <aside class="log" id="log" aria-label="事件记录">
    <h3>Event Log</h3>
    <ul id="logList" aria-live="polite"></ul>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">面板</h2>
      <button type="button" id="btnClose" class="ico" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/layout.js"></script>
<script src="js/project.js"></script>
<script src="js/physics.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/fx.js"></script>
<script src="js/render/util.js"></script>
<script src="js/render/vrng.js"></script>
<script src="js/render/pile.js"></script>
<script src="js/render/coin.js"></script>
<script src="js/render/machine.js"></script>
<script src="js/render/pusher.js"></script>
<script src="js/render/chute.js"></script>
<script src="js/render/hero.js"></script>
<script src="js/render/payout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
